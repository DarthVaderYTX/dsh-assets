# One prompt, several target models. Each model carries its own endpoint,
# key source and decoding settings. The headline score is the weighted mean
# of per-model scores; the report also shows every model separately.
models:
  - name: deepseek-chat
    model: deepseek-chat
    base_url: https://api.deepseek.com/v1
    api_key_env: PROMPT_OPT_API_KEY
    temperature: 0.0
    max_tokens: 1024
    weight: 2

  - name: local-qwen
    model: qwen2.5-7b-instruct
    base_url: http://127.0.0.1:11434/v1
    temperature: 0.2
    max_tokens: 2048
    weight: 1

# Optional: override the judge and optimizer independently of the CLI flags.
judge:
  model: deepseek-chat
  base_url: https://api.deepseek.com/v1
  temperature: 0
  max_tokens: 1024
  api_key_env: PROMPT_OPT_API_KEY

optimizer:
  model: deepseek-chat
  base_url: https://api.deepseek.com/v1
  temperature: 0.7
  max_tokens: 2048
  api_key_env: PROMPT_OPT_API_KEY
